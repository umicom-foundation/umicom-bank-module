schema: umicom.application.v1

application:
  id: org.umicom.bank
  name: Umicom Bank
  short_name: Bank
  version: 0.1.0
  executable: umicom-bank-console
  aliases: [bank]

framework:
  minimum_version: 0.9.0
  compatible_major: 0

frontends:
  - console

entry:
  kind: workbench
  taskbar_group: finance
  pinned_by_default: false
  default_layout: banking

capabilities:
  - umicom.banking
  - umicom.payments
  - umicom.accounting
  - umicom.digital-asset
  - umicom.application.experience
  - umicom.application.federation

source_layout:
  product_root: src
  composition_root: src
  console_frontend: src/console

boundaries:
  owns_reusable_framework_logic: false
  owns_persistence: false
  consumes_framework_services: true

installation:
  component: Bank
  selected_by_default: true
  show_in_application_launcher: true
